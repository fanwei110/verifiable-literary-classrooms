    \               BOOK IX\n\n               BOOK X\n\n  BOOK I.\n\nOf Mans First\
    \ Disobedience, and the Fruit\nOf that Forbidden Tree, whose mortal tast\nBrought\
    \ Death into the World, and all our woe,\nWith loss of _Eden_, till one greater\
    \ Man\nRestore us, and regain the blissful Seat,\nSing Heav’nly Muse, that on\
    \ the secret top\nOf _Oreb_, or of _Sinai_, didst inspire\nThat Shepherd, who\
    \ first taught the chosen Seed,\nIn the Beginning how the Heav’ns and Earth\n\
    Rose out of _Chaos_: Or if _Sion_ Hill\nDelight thee more, and _Siloa’s_ Brook\
    \ that flow’d\nFast by the Oracle of God; I thence\nInvoke thy aid to my adventrous\
    \ Song,\nThat with no middle flight intends to soar\nAbove th’ _Aonian_ Mount,\
    \ while it pursues\nThings unattempted yet in Prose or Rhime.\nAnd chiefly Thou\
    \ O Spirit, that dost prefer\nBefore all Temples th’ upright heart and pure,\n\
    Instruct me, for Thou know’st; Thou from the first\nWast present, and with mighty\
    \ wings outspread\nDove-like satst brooding on the vast Abyss\nAnd mad’st it pregnant:\
