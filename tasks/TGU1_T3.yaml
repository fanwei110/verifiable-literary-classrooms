    \ off your hands.\n\nHORATIO.\nBe rul’d; you shall not go.\n\nHAMLET.\nMy fate\
    \ cries out,\nAnd makes each petty artery in this body\nAs hardy as the Nemean\
    \ lion’s nerve.\n\n[_Ghost beckons._]\n\nStill am I call’d. Unhand me, gentlemen.\n\
    \n[_Breaking free from them._]\n\nBy heaven, I’ll make a ghost of him that lets\
